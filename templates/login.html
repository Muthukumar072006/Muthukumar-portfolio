<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-alt);
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 380px;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Admin Login</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <p style="color: red; font-size: 0.9rem; text-align: center; margin-bottom: 15px;">{{ messages[0] }}</p>
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="contact-form">
            <input type="text" name="username" placeholder="Username" required style="margin-bottom: 12px;">
            <input type="password" name="password" placeholder="Password" required style="margin-bottom: 20px;">
            <button type="submit" class="btn primary-btn btn-block">Login</button>
        </form>
    </div>

</body>
</html>
